{% extends 'staff/staff_base.html' %}
{% block body %}
<div class="container mt4">
    <h2>Assigned Treks</h2>
    <table class="table table-bordered">
        <thead>
            <tr class="">
                <th>Trek Name</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            {% for trek in my_trek %}
            <tr>
                
                    
                <td>{{ trek.name }}</td>
                <td>{{ trek.location }}</td>
                <td>{{ trek.status }}</td>
                <td><a href="{{ url_for('staff.manage_trek', trek_id = trek.id) }}" class="btn btn-small btn-success">Manage</a></td>

                
            </tr>
            {% endfor %}
        </thead>
    </table>
</div>
{% endblock %}
