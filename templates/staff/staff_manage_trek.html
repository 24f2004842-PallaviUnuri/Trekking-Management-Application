{% extends 'staff/staff_base.html' %}
{% block body %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-md mb-4">
                <div class="card-header bg-dark text-white">Manage Trek:</div>
                <div class="card-body">
                    <p><strong>Name: </strong>{{ trek.name }}</p>
                    <p><strong>Location: </strong>{{ trek.location }}</p>
                    <p><strong>Difficulty: </strong>{{ trek.difficulty}}</p>
                    <p><strong>Duration: </strong>{{ trek.duration }}</p>
                    <p><strong>Description: </strong>{{ trek.description }}</p>

                    <form action="{{ url_for('staff.manage_trek',trek_id = trek.id) }}" method="POST">
                        <div class="mb-3">
                            <label for="available_slot" class="form-label">Available Slot: </label>
                            <input type="available_slot" class="form-control" name="available_slots" min="0" value="{{ trek.available_slots }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="status">Status: </label>
                            <select name="status" id="status" class="form-select" required>
                                <option value="Open" {% if trek.status == "Open" %}
                                    selected
                                {% endif %}>Open</option>
                                <option value="Closed" {% if trek.status == "Closed" %}
                                    selected
                                {% endif %}>Closed</option>
                                <option value="Completed" {% if trek.status == "Completed" %}
                                    selected
                                {% endif %}>Completed</option>
                            </select>
                        </div>
                        <button class="btn btn-primary">Update Trek</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
