{% extends 'base.html' %} {% block content %}

<div class="container mt-4">
  <!-- Page Heading -->
  <div class="text-center mb-4">
    <h2 class="text-success fw-bold">Trekking Management Application</h2>
    <p class="text-muted">
      Create your account to start your trekking journey.
    </p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-8">
      <div class="card border-success shadow">
        <!-- Card Header -->
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">Create Account</h4>
        </div>

        <div class="card-body">
          <form method="POST" action="{{ url_for('auth.register') }}">
            <!-- Name & Email -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input
                  type="text"
                  name="name"
                  class="form-control"
                  placeholder="Enter your name"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Email Address</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <!-- Role -->
            <div class="mb-3">
              <label class="form-label">Register As</label>
              <select name="role" class="form-select" required>
                <option value="">Select Role</option>
                <option value="trekker">Trekker</option>
                <option value="staff">Trek Staff</option>
              </select>
            </div>

            <!-- Password & Confirm Password -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter password"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                  type="password"
                  name="confirm_password"
                  class="form-control"
                  placeholder="Confirm password"
                  required
                />
              </div>
            </div>

            <!-- Register Button -->
            <div class="d-grid mt-2">
              <button type="submit" class="btn btn-success">Register</button>
            </div>
          </form>

          <hr />

          <p class="text-center mb-0">
            Already have an account?
            <a
              href="{{ url_for('auth.login') }}"
              class="text-success fw-semibold text-decoration-none"
            >
              Login
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
