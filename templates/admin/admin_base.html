{% extends 'base.html' %} {% block content %}

<div class="d-flex">
  <!--Sidebar-->

  <div id="sidebar" class="sidebar bg-success">
    <div class="p-3">
      <h4 class="text-white text-center mb-5"></h4>

      <div class="list-group">
        <a
          href="{{ url_for('admin.dashboard') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.dashboard' %}active{% endif %}"
        >
          Dashboard
        </a>

        <a
          href="{{ url_for('admin.manage_treks') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.manage_treks' %}active{% endif %}"
        >
          Manage Treks
        </a>

        <a
          href="{{ url_for('admin.manage_staff') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.manage_staff' %}active{% endif %}"
        >
          Manage Staff
        </a>

        <a
          href="{{ url_for('admin.manage_user') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.manager_user' %}active{% endif %}"
        >
          Manage Users
        </a>

        <a
          href="{{ url_for('admin.manage_bookings') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.mangage_bookings' %}active{% endif %}"
        >
          All Bookings
        </a>

        <a
          href="{{ url_for('admin.profile') }}"
          class="list-group-item list-group-item-action {% if request.endpoint=='admin.profile' %}active{% endif %}"
        >
          Profile
        </a>

        <a
          href="{{ url_for('auth.logout') }}"
          class="list-group-item list-group-item-action bg-danger {% if request.endpoint=='auth.logout' %}active{% endif %}"
        >
          Logout
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content  -->

  <div id="main-content" class="flex-grow-1">
    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-success shadow-sm">
      <div class="container-fluid">
        <!-- Toggle Button -->

        <button class="btn btn-outline-light" onclick="toggleSidebar()">
          ☰
        </button>

        <span class="navbar-brand fw-bold ms-3">
          Trekking Management Application
        </span>

        <div class="ms-auto text-white">
          Welcome,
          <strong>{{ current_user.name }}</strong>
        </div>
      </div>
    </nav>

    <!-- Page Content -->

    <div class="container-fluid p-4">
      {% block admin_content %} {% endblock %}
    </div>
  </div>
</div>

<style>
  body {
    background: #f8f9fa;
  }

  /* Sidebar */

  .sidebar {
    width: 250px;

    min-height: 100vh;

    transition: all 0.3s ease;

    overflow: hidden;
  }

  /* Hide Sidebar */

  .sidebar.hide {
    width: 0;

    padding: 0;
  }

  /* Sidebar Menu */

  .sidebar .list-group-item {
    border: none;

    margin-bottom: 8px;

    border-radius: 8px;
  }

  .sidebar .list-group-item.active {
    background: #146c43;

    color: white;
  }

  /* Content */

  #main-content {
    transition: all 0.3s ease;
  }
</style>

<script>
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("hide");
  }
</script>

{% endblock %}
